
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean TOPIK Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5fb;color:#202943;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{background:linear-gradient(135deg,#303d91,#7168e8);
color:white;padding:25px 18px;border-radius:0 0 25px 25px}
header h1{margin:0 0 8px;font-size:27px}
header p{margin:0;opacity:.9}
main{max-width:850px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}
.stat,.panel,.item{background:white;border-radius:15px;padding:15px;
box-shadow:0 3px 14px #18234b0c}
.stat strong{display:block;font-size:23px;color:#655be0}
.stat span{font-size:12px;color:#6c7284}
nav{display:flex;gap:8px;overflow-x:auto;padding:5px 0 14px}
button,select,input{font:inherit}
nav button,.action{border:0;border-radius:10px;padding:11px 14px;
background:#e6e8f7;color:#333b78;white-space:nowrap;cursor:pointer}
nav button.active,.action{background:#6259df;color:white}
.panel{margin-bottom:15px}
h2{font-size:19px;margin:3px 0 14px}
input,select{width:100%;padding:12px;border:1px solid #d9ddec;
border-radius:10px;background:white;margin:5px 0 10px}
.item{margin:10px 0;border:1px solid #edf0f7}
.word{font-size:22px;font-weight:750}
.translation{margin:5px 0;color:#5e59d4;font-weight:600}
.small{font-size:13px;color:#72798b;line-height:1.6}
.tag{font-size:11px;background:#efedff;color:#574dcc;
padding:4px 8px;border-radius:20px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item button{border:0;background:#efedff;color:#5549d0;
padding:8px 10px;border-radius:9px;cursor:pointer}
.answer{display:block;width:100%;text-align:left;margin:8px 0;
padding:12px;border:1px solid #dfe2ef;border-radius:10px;
background:white;color:#202943;cursor:pointer}
.answer:active{background:#eeecff}
.hide{display:none}
footer{text-align:center;padding:20px;color:#81869a;font-size:12px}
</style>
</head>
<body>
<header>
  <div style="font-size:12px;letter-spacing:2px">KOREAN LANGUAGE</div>
  <h1>🇰🇷 TOPIK Academy</h1>
  <p>Анхан шатнаас TOPIK 6 хүртэл</p>
</header>

<main>
  <div class="stats">
    <div class="stat"><strong id="learned">0</strong><span>Сурсан үг</span></div>
    <div class="stat"><strong id="savedCount">0</strong><span>Хадгалсан</span></div>
    <div class="stat"><strong id="correct">0</strong><span>Зөв хариулт</span></div>
  </div>

  <nav>
    <button class="active" data-tab="words">📚 Үгс</button>
    <button data-tab="rules">📝 Дүрэм</button>
    <button data-tab="quiz">🎯 Тест</button>
    <button data-tab="saved">⭐ Хадгалсан</button>
  </nav>

  <section id="words">
    <div class="panel">
      <h2>Үгийн сан</h2>
      <input id="search" placeholder="Солонгос эсвэл монгол үгээр хайх...">
      <select id="level">
        <option value="all">Бүх түвшин</option>
        <option value="1">TOPIK 1</option>
        <option value="2">TOPIK 2</option>
        <option value="3">TOPIK 3</option>
        <option value="4">TOPIK 4</option>
        <option value="5">TOPIK 5</option>
        <option value="6">TOPIK 6</option>
      </select>
      <div class="small">Үг дээр дарж хадгалах эсвэл сурсан гэж тэмдэглээрэй.</div>
    </div>
    <div id="wordList"></div>
  </section>

  <section id="rules" class="hide">
    <div class="panel">
      <h2>Солонгос хэлний дүрэм</h2>
      <input id="ruleSearch" placeholder="Дүрэм хайх...">
      <select id="ruleLevel">
        <option value="all">Бүх түвшин</option>
        <option value="1">TOPIK 1</option>
        <option value="2">TOPIK 2</option>
        <option value="3">TOPIK 3</option>
        <option value="4">TOPIK 4</option>
        <option value="5">TOPIK 5</option>
        <option value="6">TOPIK 6</option>
      </select>
    </div>
    <div id="ruleList"></div>
  </section>

  <section id="quiz" class="hide">
    <div class="panel">
      <h2>🧠 Үгийн тест</h2>
      <p id="question">Эхлэх товчийг дарна уу.</p>
      <div id="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button class="action" id="next">Тест эхлүүлэх / Дараагийн асуулт</button>
    </div>
  </section>

  <section id="saved" class="hide">
    <div class="panel"><h2>⭐ Миний хадгалсан үгс</h2></div>
    <div id="savedList"></div>
  </section>
</main>
<footer>TOPIK Academy · Өдөр бүр бага багаар суралцъя 🇰🇷</footer>

const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let learned=get("topik_learned",[]);
let saved=get("topik_saved",[]);
let correct=get("topik_correct",0);
const persist=()=>{
 localStorage.setItem("topik_learned",JSON.stringify(learned));
 localStorage.setItem("topik_saved",JSON.stringify(saved));
 localStorage.setItem("topik_correct",JSON.stringify(correct));
};
function stats(){
 document.getElementById("learned").textContent=learned.length;
 document.getElementById("savedCount").textContent=saved.length;
 document.getElementById("correct").textContent=correct;
}
function showWords(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const l=document.getElementById("level").value;
 const list=words.filter(w=>(w.ko+" "+w.mn+" "+w.ex).toLowerCase().includes(q)&&(l==="all"||w.level==l));
 document.getElementById("wordList").innerHTML=list.map(w=>`
 <div class="item">
 <div class="row"><span class="tag">TOPIK ${w.level}</span>
 <button onclick="toggleSave(${w.id})">${saved.includes(w.id)?"★ Хадгалсан":"☆ Хадгалах"}</button></div>
 <p class="word">${w.ko}</p><p class="translation">${w.mn}</p>
 <p class="small">${w.ex}</p>
 <button onclick="toggleLearn(${w.id})">${learned.includes(w.id)?"✓ Сурсан":"Сурсан гэж тэмдэглэх"}</button>
 </div>`).join("")||"<p>Үг олдсонгүй.</p>";
}
function showRules(){
 const q=document.getElementById("ruleSearch").value.toLowerCase().trim();
 const l=document.getElementById("ruleLevel").value;
 const list=rules.filter(r=>(r.name+" "+r.mn+" "+r.desc+" "+r.ex).toLowerCase().includes(q)&&(l==="all"||r.level==l));
 document.getElementById("ruleList").innerHTML=list.map(r=>`
 <div class="item"><span class="tag">TOPIK ${r.level}</span>
 <p class="word">${r.name}</p><p class="translation">${r.mn}</p>
 <p>${r.desc}</p><p class="small">Жишээ: ${r.ex}</p></div>`).join("")||"<p>Дүрэм олдсонгүй.</p>";
}
function toggleSave(id){
 saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
 persist();stats();showWords();showSaved();
}
function toggleLearn(id){
 learned=learned.includes(id)?learned.filter(x=>x!==id):[...learned,id];
 persist();stats();showWords();
}
function showSaved(){
 const list=words.filter(w=>saved.includes(w.id));
 document.getElementById("savedList").innerHTML=list.map(w=>`
 <div class="item"><p class="word">${w.ko}</p><p class="translation">${w.mn}</p>
 <p class="small">${w.ex}</p><button onclick="toggleSave(${w.id})">Хасах</button></div>`).join("")||"<p>Одоогоор хадгалсан үг алга.</p>";
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hide"));
 document.getElementById(b.dataset.tab).classList.remove("hide");
 if(b.dataset.tab==="saved")showSaved();
}));
document.getElementById("search").addEventListener("input",showWords);
document.getElementById("level").addEventListener("change",showWords);
document.getElementById("ruleSearch").addEventListener("input",showRules);
document.getElementById("ruleLevel").addEventListener("change",showRules);

let current=null,answered=false;
function nextQuestion(){
 if(words.length<4)return;
 current=words[Math.floor(Math.random()*words.length)];
 answered=false;
 document.getElementById("feedback").textContent="";
 document.getElementById("question").textContent=`"${current.ko}" гэдэг үг ямар утгатай вэ?`;
 const opts=[current];
 while(opts.length<4){
  const w=words[Math.floor(Math.random()*words.length)];
  if(!opts.some(x=>x.id===w.id))opts.push(w);
 }
 opts.sort(()=>Math.random()-.5);
 document.getElementById("answers").innerHTML=opts.map(w=>
 `<button class="answer" onclick="checkAnswer(${w.id})">${w.mn}</button>`).join("");
}
function checkAnswer(id){
 if(answered)return;
 answered=true;
 if(id===current.id){
  correct++;persist();stats();
  document.getElementById("feedback").textContent="🎉 Зөв хариуллаа!";
 }else{
  document.getElementById("feedback").textContent="❌ Зөв хариулт: "+current.mn;
 }
}
document.getElementById("next").addEventListener("click",nextQuestion);
showWords();showRules();showSaved();stats();
</script>
